const $=i=>document.getElementById(i),Q=[],V={},M=[{n:'NEON 7s',k:3,sy:['🍒','🍋','🔔','⭐','💎','7'],hi:'7',c:'#ff2ea6',w:4,j:10},{n:'GOLD RUSH',k:3,sy:['💰','🪙','🔔','💎','👑','7'],hi:'👑',c:'#ffd166',w:5,j:20},{n:'COSMIC',k:3,sy:['🪐','🌙','⭐','☄️','👽','🚀'],hi:'👽',c:'#38bdf8',w:4,j:15}],tm=b=>S&&(S.fm||S.sr>=20)?1:b>=100?3:b>=50?2:b>=25?1.5:b>=10?1.25:1,TL='LLNLLLLNLW',R=a=>a[Math.random()*a.length|0],
SC={A:{n:'Лесен старт',d:'Печалба в началото, после редки малки печалби.',s:'WLNLLLWLLNLLLLDLNLLW'},B:{n:'Люлка',d:'Малки печалби и много почти-печалби.',s:'LWLNLLLLDLLNLLWLLLNL'},C:{n:'Силен старт',d:'Силен старт, рядък джакпот и дълга суха серия.',s:'WLLNLLLBLLNLLLLDLLLW'}},
EV={raise:['Увеличи залога след загуба','#ff2ea6'],chase:['Продължи, за да си върне парите','#b06cff'],over:['Надцени контрола над резултата','#ffd166'],ign:['Пренебрегна възможността да спре','#ff5470'],dep:['Внесе още пари след загуба','#38bdf8']},
st=f=>{let k=0,L=S.log;while(k<L.length&&f(L[L.length-1-k]))k++;return k},
wn=()=>st(x=>x.pay>x.bet),ln=()=>st(x=>x.pay<x.bet),net=()=>S.bal+S.wd-100-S.dep,
CD={
control:['Илюзия за контрол','Усещането, че залогът, ритъмът или „системата“ ти влияят на резултата.',()=>`След ${wn()} печеливши завъртания е лесно да се почувстваш „в ритъм“. Тук резултатът е зададен от машината — залогът променя само сумата, не изхода.`],

near:['Почти-печалба','Два символа от три се усещат като „на косъм“, но са загуба. Машините често показват такива резултати.',()=>'Почти всички символи съвпаднаха, а последният е точно над линията. Усещането е за близост, а резултатът е загуба.'],
ldw:['Загуба, маскирана като печалба','Печалба под залога пуска светлини и „ПЕЧАЛБА“, но реално си на минус.',()=>{const l=S.log[S.log.length-1];return `Заложи ${l.bet} €, получи ${l.pay} €. Екранът празнува, а ти си на −${l.bet-l.pay} €.`}],
esc:['Примамка за по-висок залог','Множители, които растат със залога, подтикват към по-големи суми — а с тях растат и загубите.',()=>{const l=S.log[S.log.length-1];return `Залогът от ${l.bet} € ти даде множител ×${tm(l.bet)}. Той е примамка: рискуваш повече, а резултатът пак не зависи от теб.`}],

V.roul=()=>{const a=360/37,row=r=>[...Array(12).keys()].map(i=>{const n=3*i+r;return `<button class='sp' id='s_n${n}' style='background:${rc(n)}' onclick='rpl("n${n}")'>${n}</button>`}).join('')+`<button class='sp' id='s_c${r}' onclick='rpl("c${r}")'>2:1</button>`,ob=(k,t,s)=>`<button class='sp' id='s_${k}' style='${s}' onclick='rpl("${k}")'>${t}</button>`;
return gh('Европейска рулетка','37 числа · честни шансове 1/37',`<button class='ib' onclick='rinfo()'>${ic('info')}</button>`)+`<div class='gl'><div><section class='cab' style='--cc:#e0264f'><div class='bez' style='padding:16px'><div class='rwrap'><div class='rw' id='rw' style='background:conic-gradient(${RW.map((n,i)=>`${rc(n)} ${i*a}deg ${(i+1)*a}deg`).join(',')})'>${RW.map((n,i)=>`<b style='transform:rotate(${(i+.5)*a}deg) translateY(-97px)'>${n}</b>`).join('')}</div><div class='ring' id='ring'><i></i></div><div class='rr' id='rr'>?</div></div></div><div class='res' id='res' style='margin-top:10px'>Постави залози на масата и завърти.</div><div class='hist' id='rhist'>${rh()}</div></section></div><div>${bar()}<section class='card'><div class='tbl'>${ob('n0','0','background:#1faa5a;grid-column:1/14')}${row(3)}${row(2)}${row(1)}${ob('d1','1–12','grid-column:span 4')}${ob('d2','13–24','grid-column:span 4')}${ob('d3','25–36','grid-column:span 5')}${ob('low','1–18','grid-column:span 2')}${ob('even','Четно','grid-column:span 2')}${ob('red','Червено','background:#e0264f;grid-column:span 2')}${ob('black','Черно','background:#2a2257;grid-column:span 2')}${ob('odd','Нечетно','grid-column:span 2')}${ob('high','19–36','grid-column:span 3')}</div><div class='res' id='rl' style='font-size:13px'></div><div class='row'><small>Стойност на един залог</small></div><div class='row'><button class='btn s sm' onclick='setb(S.bet-1)'>−</button><input id='bi' type='number' min='1' inputmode='numeric' onchange='setb(this.value)'><button class='btn s sm' onclick='setb(S.bet+1)'>+</button></div><div class='chips' id='chips'></div><button class='spin' id='pl' onclick='rplay()'>ЗАВЪРТИ</button><button class='lnk' onclick='rclr()'>Изчисти залозите</button></section></div></div>`};
const EU=[[8,'билет за кино'],[12,'месечен абонамент за стрийминг'],[60,'чифт спортни обувки'],[150,'самолетен билет в Европа'],[300,'смартфон от среден клас'],[800,'лаптоп'],[2500,'почивка за двама'],[6000,'употребяван автомобил'],[20000,'нов малък автомобил'],[50000,'първоначална вноска за жилище']],
fm=n=>Math.round(n).toLocaleString('bg-BG'),
buy=(a,k)=>{const L=EU.filter(x=>x[0]<=a).slice(-k);return L.length?L.map(x=>`${Math.floor(a/x[0])}× ${x[1]}`).join(', '):'твърде малка сума за примерите'},
fv=w=>{const r=Math.pow(1.05,1/52)-1;return 100*(Math.pow(1+r,w)-1)/r},
cost=()=>{const L=S.log,bt=L.reduce((a,l)=>a+l.bet,0),py=L.reduce((a,l)=>a+l.pay,0),gl=L.reduce((a,l)=>a+Math.max(0,l.bet-l.pay),0),gw=L.reduce((a,l)=>a+Math.max(0,l.pay-l.bet),0),n=net(),nl=Math.max(0,-n),sh=nl/(100+S.dep),lr=bt?gl/bt:0,wr=bt?gw/bt:0,P=[['Месец',52/12],['Година',52],['5 години',260],['10 години',520]],c=(a,b,k)=>`<div><small>${a}</small><b class='${k||''}'>${b}</b></div>`;
return `<div class='cs'><h3>Колко струва играта</h3><div class='grid'>${c('Общо рундове',L.length)}${c('Общо заложено',fm(bt)+' €')}${c('Общо изплатено',fm(py)+' €')}${c('Нетен резултат',(n>0?'+':'')+fm(n)+' €',n<0?'rd':'g')}${c('Общо загубено във всички губещи рундове',fm(gl)+' €','rd')}${c('Общо спечелено във всички печеливши рундове',fm(gw)+' €','g')}</div><p class='note'>Загубените суми се броят и когато си печелил в други рундове: парите, излезли от баланса ти в губещите рундове, са реалната цена на играта.</p>${n>0?`<p class='note'>Нетният ти резултат е на плюс — това е краткосрочен късмет. В дългосрочен план математическото предимство на казиното води до загуба.</p>`:''}<p><b>С ${fm(bt)} € (общо заложени)</b> можеше да купиш: ${buy(bt,4)}.</p><p><b>С ${fm(gl)} € (общо загубени)</b> можеше да купиш: ${buy(gl,4)}.</p><h3>Ако всяка седмица залагаш по 100 €</h3><table><tr><th>Период</th><th>Заложени</th><th>Загубени</th><th>Спечелени</th><th>Нетно</th></tr>${P.map(p=>`<tr><td>${p[0]}</td><td>${fm(100*p[1])} €</td><td class='rd'>${fm(100*p[1]*lr)} €</td><td class='g'>${fm(100*p[1]*wr)} €</td><td class='${wr<lr?'rd':'g'}'>${fm(100*p[1]*(wr-lr))} €</td></tr>`).join('')}</table><p class='note'>Изчислено със същото съотношение като в тази симулация: от всеки 100 € залози ${fm(lr*100)} € са загубени, а ${fm(wr*100)} € спечелени.</p><p>За година загубените суми са ${fm(5200*lr)} € = ${buy(5200*lr,3)}.</p><p>За 10 години: ${fm(52000*lr)} € = ${buy(52000*lr,3)}.</p>${nl?`<p>Ако вместо това всяка седмица внасяш по 100 € и ги губиш както в тази сесия (${Math.round(sh*100)}% от вложените): ${fm(5200*sh)} € за година и ${fm(52000*sh)} € за 10 години.</p>`:''}<p>Ако същите 100 € седмично бяха инвестирани, примерно стойността им би била: месец ~${fm(fv(52/12))} €, година ~${fm(fv(52))} €, 5 години ~${fm(fv(260))} €, 10 години ~${fm(fv(520))} €. Или можеха да станат аварийни спестявания, образование, пътуване или първоначална вноска. <small>*Примерна изчислена стойност при 5% годишна доходност, без гаранция и без такси; не е финансов съвет. Цените са примерни.</small></p></div>`};
if(S)S.busy=0;go('home');
</script></body></html>
